<!DOCTYPE html>
<html>
<head>
  <title data-i18n="options_title">500NewTabs - Options</title>
  <link rel="stylesheet" href="./css/bulma.min.css">
  <link rel="stylesheet" href="./css/bulma.tooltip.min.css">
  <link rel="stylesheet" href="./css/options.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div class="modal is-active">
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title" data-i18n="options_title">500NewTabs - Options</p>
      </header>
      <section class="modal-card-body">
          <div class="columns is-gapless is-multiline">
            <div class="column is-4">
              <label 
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline" 
                data-i18n="options_time" 
                attr-i18n="data-tooltip:options_tooltip_time"
              >
                Show Time
              </label>
            </div>
            <div class="column is-8">
              <input type="checkbox" id="time">
            </div>

          <div class="columns is-gapless is-multiline">
            <div class="column is-4">
              <label 
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline" 
                data-i18n="options_greetings" 
                attr-i18n="data-tooltip:options_tooltip_greetings"
              >
                Show Greetings
              </label>
            </div>
            <div class="column is-8">
              <input type="checkbox" id="greetings">
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_name"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_name"
              >Name</label>
            </div>
            <div class="column is-8">
              <input class="input" type="text" id="name">
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_discover"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_discover"
              >
                Discover Mode
              </label>
            </div>
            <div class="column is-8">
              <div class="select">
                <select id="discover" style="width: 200px">
                  <option value="leaderboard_weekly" data-i18n="options_discover_8">Leaderboard Weekly</option>
                  <option value="leaderboard_monthly" data-i18n="options_discover_9">Leaderboard Monthly</option>
                  <option value="editors_choice" data-i18n="options_discover_10">Editors' Choice</option>
                  <option value="gallery" data-i18n="options_discover_1">500px Gallery</option>
                  <option value="cgallery" data-i18n="options_discover_7">Custom Gallery</option>
                </select>
                    </div>
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_custom_gallery"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_custom_gallery"
              >Custom Gallery</label>
            </div>
            <div class="column is-8">
              <input class="input" type="text" id="cgalleryid" disabled>
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_editors_categories"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_editors_categories"
              >Categories</label>
            </div>
            <div class="column is-8">
              <div class="select is-multiple">
                <select id="editors_categories" multiple size="8" disabled>
                  <option value="landscape" data-i18n="options_editors_cat_landscape">Landscape</option>
                  <option value="city" data-i18n="options_editors_cat_city">City</option>
                  <option value="people" data-i18n="options_editors_cat_people">People</option>
                  <option value="events" data-i18n="options_editors_cat_events">Events</option>
                  <option value="still life" data-i18n="options_editors_cat_still_life">Still Life</option>
                  <option value="nature" data-i18n="options_editors_cat_nature">Nature</option>
                  <option value="sports" data-i18n="options_editors_cat_sports">Sports</option>
                  <option value="creative" data-i18n="options_editors_cat_creative">Creative</option>
                </select>
              </div>
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_safemode"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_safemode"
              >Safemode</label>
            </div>
            <div class="column is-8">
              <input type="checkbox" id="safemode">
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_interval"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_interval"
              >Interval</label>
            </div>
            <div class="column is-8">
              <input class="input" type="text" id="interval">
            </div>

            <div class="column is-4">
              <label 
                data-i18n="options_random"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_random"
              >Random order</label>
            </div>
            <div class="column is-8">
              <input type="checkbox" id="random">
            </div>
          </div>
          
            <div class="column is-4">
              <label 
                data-i18n="options_keepLastTab"
                class="has-tooltip-right has-tooltip-arrow has-tooltipl-multiline"
                attr-i18n="data-tooltip:options_tooltip_keepLastTab"
              >Keep last tab open</label>
            </div>
            <div class="column is-8">
              <input type="checkbox" id="keepLastTab">
            </div>
          </div>
          
      </section>
      <footer class="modal-card-foot">
        <button 
          id="update" 
          data-i18n="options_update"
          class="button is-link"
          attr-i18n="data-tooltip:options_tooltip_update"
          data-tooltip="Update the cached images."
        >Update</button>
        <button class="button is-primary" id="save" data-i18n="options_save">Save</button>
        <div class="notification is-warning p-2 ml-5" id="status">Status information</div>
      </footer>
    </div>
  </div>
  <script src="js/options.js" type="module"></script>
  <script src="js/i18n.js" type="module"></script>
</body>
</html>
